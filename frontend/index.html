<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LEMP assignment Roni Kokkonen</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <main class="container py-5" style="max-width: 720px">
      <h1>Workflow demo</h1>
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="card-title mb-1">Todo List</h1>
          <p class="text-secondary mb-4">Keep track of what needs doing.</p>

          <form id="todo-form" class="input-group mb-3">
            <input
              id="todo-title"
              class="form-control"
              type="text"
              maxlength="255"
              placeholder="Add a todo"
              required
            />
            <button class="btn btn-primary" type="submit">Add</button>
          </form>
          <p id="status" class="alert alert-danger d-none" role="alert"></p>
          <ul id="todos" class="list-group"></ul>
        </div>
      </div>

      <h1>Oulu weather</h1>
      <p id="weather">Loading weather...</p>
      <p id="windspeed"></p>
      <p id="temperature"></p>

      <button type="button" class="btn btn-outline-dark">
        <a
          href="https://a3s.fi/swift/v1/cloudservicesproject/Lemp%20assignment%20Roni%20Kokkonen.pdf"
          target="_blank"
          rel="noopener"
          class="link-dark"
        >
          Documentation pdf for week 4
        </a>
      </button>
      <button type="button" class="btn btn-outline-dark">
        <a
          href="https://a3s.fi/swift/v1/cloudservicesproject/cloudServicesWeek5Documentation.pdf"
          target="_blank"
          rel="noopener"
          class="link-dark"
        >
          Documentation pdf for week 5
        </a>
      </button>
      <h1>CI/CD assignment</h1>
    </main>
    <script>
      const form = document.getElementById("todo-form");
      const titleInput = document.getElementById("todo-title");
      const todosElement = document.getElementById("todos");
      const statusElement = document.getElementById("status");

      async function loadWeather() {
        const weatherElement = document.querySelector("#weather");
        const windspeedElement = document.querySelector("#windspeed");
        const temperatureElement = document.querySelector("#temperature");

        try {
          const response = await fetch("/api/weather");

          if (!response.ok) {
            throw new Error(`Weather request failed (${response.status})`);
          }

          const data = await response.json();
          weatherElement.textContent = data.current.summary;
          windspeedElement.textContent =
            "Windspeed: " + data.current.wind.speed + " m/s";
          temperatureElement.textContent =
            "Temperature: " + data.current.temperature + " °c";
        } catch (error) {
          weatherElement.textContent = `Unable to load weather: ${error.message}`;
        }
      }

      loadWeather();

      async function loadTodos() {
        const response = await fetch("/api/todos");
        if (!response.ok) throw new Error(`Loading failed: ${response.status}`);

        const todos = await response.json();
        todosElement.replaceChildren();

        for (const todo of todos) {
          const item = document.createElement("li");
          const toggle = document.createElement("button");
          const title = document.createElement("span");
          const remove = document.createElement("button");

          item.className = "list-group-item d-flex align-items-center gap-2";
          toggle.className = "btn btn-outline-success btn-sm";
          title.className = "flex-grow-1";
          remove.className = "btn btn-outline-danger btn-sm";
          toggle.textContent = todo.completed ? "Undo" : "Done";
          title.textContent = todo.title;
          title.style.textDecoration = todo.completed ? "line-through" : "none";
          remove.textContent = "Delete";

          toggle.addEventListener("click", async () => {
            await fetch(`/api/todos/${todo.id}`, { method: "PATCH" });
            await loadTodos();
          });

          remove.addEventListener("click", async () => {
            await fetch(`/api/todos/${todo.id}`, { method: "DELETE" });
            await loadTodos();
          });

          item.append(toggle, title, remove);
          todosElement.appendChild(item);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusElement.textContent = "";
        statusElement.classList.add("d-none");

        const response = await fetch("/api/todos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: titleInput.value }),
        });

        if (!response.ok) {
          statusElement.textContent = "Could not add todo";
          statusElement.classList.remove("d-none");
          return;
        }

        titleInput.value = "";
        await loadTodos();
      });

      loadTodos().catch((error) => {
        statusElement.textContent = error.message;
        statusElement.classList.remove("d-none");
      });
    </script>
  </body>
</html>
